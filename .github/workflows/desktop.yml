name: desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter analyze and test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Runs the DPAPI / adapter tests that are skipped elsewhere, plus the
      # bundled-server tests against a real Windows build of the Go server.
      - name: Flutter test on Windows
        working-directory: mobile
        run: |
          flutter pub get
          flutter test
      - name: Build bundled server
        # windowsgui: the child process must not open a console window.
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o mobile/windows/lanroom/lanroom-server.exe .
      - name: Build Windows app
        working-directory: mobile
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $out = "mobile/build/windows/x64/runner/Release"
          if (!(Test-Path "$out/LanRoom.exe") -or !(Test-Path "$out/lanroom-server.exe")) { throw "bundle incomplete" }
          Compress-Archive -Path "$out/*" -DestinationPath LanRoom-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LanRoom-windows-x64
          path: LanRoom-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LanRoom-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: LanRoom-windows-x64.zip
